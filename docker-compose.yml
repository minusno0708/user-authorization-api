services:
  server:
    build:
      context: .
      dockerfile: build/server/Dockerfile
    volumes:
      - .:/app
    tty: true
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    ports:
      - 8080:8080

  db:
    build:
      context: build/db
      dockerfile: Dockerfile
    volumes:
      - ./build/db/initdb.d:/docker-entrypoint-initdb.d
    ports:
      - 3306:3306
    environment:
      MARIADB_ROOT_PASSWORD: root
      TZ: Asia/Tokyo
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 10s

  cache:
    build:
      context: build/cache
      dockerfile: Dockerfile
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 10s
